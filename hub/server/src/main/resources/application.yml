server:
  port: 18081

spring:
  application:
    name: easy-claw-hub
  datasource:
    # 生产：PostgreSQL。连接信息走环境变量，不入仓。
    url: ${HUB_DB_URL:jdbc:postgresql://localhost:5432/easy_claw}
    username: ${HUB_DB_USER:postgres}
    password: ${HUB_DB_PASSWORD:xinl.tang123}
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: hub
  jpa:
    hibernate:
      # schema 一律由 Flyway 管理（见 db/migration），禁用 ddl-auto。
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: ${HUB_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false
  mvc:
    async:
      request-timeout: -1

hub:
  jwt:
    # 签名密钥：走环境变量，绝不入仓/入库。
    secret: ${HUB_JWT_SECRET:change-me-in-prod}
    access-ttl-minutes: 30
    refresh-ttl-days: 30
  security:
    # 敏感字段静态加密主密钥（llm_providers 真实 api key 的 AES-GCM 密钥派生源）：
    # 生产必须环境变量覆盖，绝不入仓真值；更换主密钥将导致既有密文无法解密。
    master-key: ${HUB_MASTER_KEY:dev-only-master-key-change-me}
