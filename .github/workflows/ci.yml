name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # GraalVM JDK 21：GraalPy 相关测试（run_python/PythonSandbox）必须跑在 GraalVM 上
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-

      - name: Compile all modules
        run: mvn -B -q compile -DskipTests

      # web/api + hub/server 及其依赖模块（agent-core/base 等）的单测
      - name: Unit tests (web/api, hub/server)
        run: mvn -B -pl web/api,hub/server -am test -Dsurefire.failIfNoSpecifiedTests=false

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        frontend-dir: [web/api/frontend, hub/server/frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.frontend-dir }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.frontend-dir }}

      # vite build 不做类型检查，tsc 与 build 都要过才算绿
      - name: Type check
        run: npx tsc --noEmit
        working-directory: ${{ matrix.frontend-dir }}

      - name: Build
        run: npx vite build --logLevel warn
        working-directory: ${{ matrix.frontend-dir }}
