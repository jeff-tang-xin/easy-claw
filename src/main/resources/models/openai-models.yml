# ============================================
# openai-models.yml (Easy-Claw)
# 覆盖 Embabel JAR 内置版本，添加国产主流大模型
# 所有模型均按 OpenAI 兼容协议定义（同一 base-url + api-key）
# 切换厂商时修改 embabel.agent.platform.models.openai.base-url 即可
# ============================================

native_support_defaults:
  structured_output:
    supported: true
    strategy: "response_format"
    strict: false
    prompt_instructions: "include"
    options:
      response_format_field: "response_format"
      type_field: "type"
      type_value: "json_schema"
      json_schema_field: "json_schema"
      name_field: "name"
      schema_field: "schema"
      strict_field: "strict"

