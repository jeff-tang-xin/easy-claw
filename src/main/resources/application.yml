server:
  port: 18080

spring:
  profiles:
    active: dev-sqlite
  application:
    name: easy-claw
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ============================
# Embabel Agent 配置
# ============================
embabel:
  models:
    default-llm: ${EMBABEL_DEFAULT_MODEL:ark-code-latest}
    default-embedding-model: text-embedding-3-small
  agent:
    platform:
      test:
        mock-mode: false
      models:
        openai:
          api-key:
          base-url:
          completions: /chat/completions
          embeddings-path: /embeddings

# ============================
# Easy-Claw 工作区配置
# ============================
easy-claw:
  workspace:
    # 默认 workspace 根目录（仅用于 WorkspaceSandbox 无上下文的兜底场景）
    # 实际 workspace 路径由前端创建并存入 SQLite
    root: ${user.dir}/workspaces
  tools:
    web:
      enabled: true

# ============================
# Brave Search (Embabel Web 工具)
# ============================
brave:
  search:
    api-key: ${BRAVE_SEARCH_API_KEY:${BRAVE_API_KEY:}}

# ============================
# Workspace 安全配置
# ============================
ai:
  workspace:
    security:
      forbidden-paths:
        - .easyClaw
        - .git
        - .env
        - .idea
        - .vscode
        - agents

# ============================
# 日志级别
# ============================
logging:
  level:
    root: INFO
    com.embabel: DEBUG
    com.embabel.plan: DEBUG
    com.xinl.easyclaw: DEBUG
  charset:
    console: UTF-8

# ============================
# SQLite profile
# ============================
---
spring:
  config:
    activate:
      on-profile: dev-sqlite
  datasource:
    url: jdbc:sqlite:${user.home}/.easyClaw/ai-assistant.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: true
