server:
  port: 18080
spring:
  profiles:
    active: dev-sqlite
  application:
    name: easy-claw
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ============================
# 日志级别：AgentScope 内部噪音降为 WARN，业务日志保持 INFO
# ============================
logging:
  level:
    root: INFO
    io.agentscope: WARN
    com.xinl.easyclaw: INFO
  charset:
    console: UTF-8
    file: UTF-8
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ============================
# AgentScope 模型配置（多 Provider 支持）
# ============================
# model.provider 为当前激活的 Provider，providers 表可配置任意多个。
# 所有 Provider 均走 OpenAI 兼容协议，AgentScope 扩展无需额外依赖。
# 所有配置集中在 application.yml；api-key 留空时按 <PROVIDER>_API_KEY 环境变量兜底。
agentscope:
  model:
    provider: ${AGENTSCOPE_PROVIDER:}
    api-key: ${AGENTSCOPE_API_KEY:}
    base-url: ${AGENTSCOPE_BASE_URL:}
    temperature: 0.3
    stream: true
  providers:
    deepseek:
      api-key:
      base-url:
      model-name:
    # 推理模型：支持 thinking（推理过程可视化），速度较慢
    deepseek-reasoner:
      api-key:
      base-url: https://api.deepseek.com/v1
      model-name: deepseek-reasoner
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url:
      model-name: ark-code-latest
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model-name: qwen-plus
    ollama:
      api-key: ollama
      base-url: http://localhost:11434/v1
      model-name: qwen2.5:7b
    moonshot:
      api-key: ${MOONSHOT_API_KEY:}
      base-url: https://api.moonshot.cn/v1
      model-name: moonshot-v1-8k
    zhipu:
      api-key: ${ZHIPU_API_KEY:}
      base-url: https://open.bigmodel.cn/api/paas/v4
      model-name: glm-4-flash

# ============================
# Workspace 安全配置
# ============================
ai:
  workspace:
    security:
      forbidden-paths:
        - .easyClaw
        - .git
        - .env
        - .idea
        - .vscode
        # AgentScope harness 运行时数据目录（<workspace>/<userId>/agents），AI 工具不可访问
        - default-user
        - agents
      max-file-size: 10485760

# ============================
# SQLite 系统元数据库（~/.easyClaw 目录，由启动类初始化）
# 所有 Workspace 共用；Workspace 自身的状态/对话数据存放在其指定目录的 .easyClaw/agent/ 下
# ============================

---
spring:
  config:
    activate:
      on-profile: dev-sqlite
  datasource:
    url: jdbc:sqlite:${user.home}/.easyClaw/ai-assistant.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: true


