server:
  port: 18080
spring:
  profiles:
    active: dev-sqlite
  application:
    name: easy-claw
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ============================
# Embabel Agent 配置
# ============================
embabel:
  models:
    default-llm: ${EMBABEL_DEFAULT_MODEL:gpt-4o-mini}
  agent:
    logging:
      personality: default
      verbosity: info

# ============================
# Easy-Claw 工作区配置
# ============================
easy-claw:
  workspace:
    root: ${user.home}/.easyClaw/workspaces
  tools:
    web:
      enabled: true

# ============================
# Embabel CoreToolGroups.WEB 需要 Brave Search API Key
# 免费申请: https://brave.com/search/api/
# ============================
brave:
  search:
    api-key: ${BRAVE_SEARCH_API_KEY:${BRAVE_API_KEY:}}

# ============================
# Spring AI / OpenAI 配置（Embabel 底层使用 Spring AI）
# 支持任何 OpenAI 兼容 API（DeepSeek、DashScope、Moonshot、Ollama 等）
# ============================
spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:${DEEPSEEK_API_KEY:}}
      base-url: ${OPENAI_BASE_URL:${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}}
      chat:
        options:
          model: ${OPENAI_MODEL:${DEEPSEEK_MODEL:deepseek-chat}}
          temperature: 0.3

# ============================
# 日志级别：Embabel 内部噪音降为 WARN，业务日志保持 INFO
# ============================
logging:
  level:
    root: INFO
    com.embabel: WARN
    com.xinl.easyclaw: INFO
  charset:
    console: UTF-8
    file: UTF-8
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ============================
# Workspace 安全配置
# ============================
ai:
  workspace:
    security:
      forbidden-paths:
        - .easyClaw
        - .git
        - .env
        - .idea
        - .vscode
        - agents
      max-file-size: 10485760

# ============================
# SQLite 系统元数据库（~/.easyClaw 目录，由启动类初始化）
# 所有 Workspace 共用；Workspace 自身的状态/对话数据存放在其指定目录的 .easyClaw/agent/ 下
# ============================

---
spring:
  config:
    activate:
      on-profile: dev-sqlite
  datasource:
    url: jdbc:sqlite:${user.home}/.easyClaw/ai-assistant.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: true
