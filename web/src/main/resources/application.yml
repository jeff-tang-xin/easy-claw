server:
  port: 18080
spring:
  profiles:
    active: dev-sqlite
  application:
    name: easy-claw
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ============================
# 日志级别：AgentScope 内部噪音降为 WARN，业务日志保持 INFO
# ============================
logging:
  level:
    root: INFO
    io.agentscope: INFO
    com.xinl.easyclaw: INFO
  charset:
    console: UTF-8
    file: UTF-8
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ============================
# AgentScope 模型配置（多 Provider 支持）
# ============================
# model.provider 为当前激活的 Provider，providers 表可配置任意多个。
# 所有 Provider 均走 OpenAI 兼容协议，AgentScope 扩展无需额外依赖。
# 所有配置集中在 application.yml；api-key 留空时按 <PROVIDER>_API_KEY 环境变量兜底。
agentscope:
  model:
    provider: ${AGENTSCOPE_PROVIDER:}
    api-key: ${AGENTSCOPE_API_KEY:}
    base-url: ${AGENTSCOPE_BASE_URL:}
    temperature: 0.3
    stream: true
    # 单次响应最大输出 token：防止长 tool_call arguments（如 write_file 的大 content）
    # 被服务端默认上限截断 → JSON 不合法 → 上游降级为 {} → 报「未找到 path/content 参数」
    # 这里只是「全局兜底值」，取所有模型都能接受的保守值；
    # 具体模型的真实上限在下方 model-limits 中按模型名覆盖（route 网关多模型必读）
    max-tokens: ${AGENTSCOPE_MAX_TOKENS:16384}
    # 并行 tool_call：开启后单轮可并发多个工具，吞吐更高。
    # 代价是多路 arguments 的流式分片会交错到达，对上游累积器的分片归位要求更高；
    # 若再次出现 JSON 不合法 / 参数串台，优先把这里改回 false 定位问题。
    parallel-tool-calls: true
  agent:
    max-iters: 50
    model-timeout-minutes: 10
    # 下界受两个硬约束钳制，调低前务必确认：
    #  1) agent_spawn 同步等待上限 600s（AgentSpawnTool.MAX_TIMEOUT_SECONDS），到点自行
    #     「提升为后台任务」返回。本值必须 > 600s，否则外层工具超时先掐断 spawn，
    #     多智能体编排的异步降级路径失效。原值 10min 与 600s 恰好相等 = 竞态，已修正。
    #  2) 必须 > shell-timeout-seconds（当前 300s），否则 shell 自身超时永远不生效。
    tool-timeout-minutes: 12
    # 工具确认弹窗等待上限（分钟）：用户不响应则自动取消本轮，释放 SSE 与会话状态
    confirm-timeout-minutes: ${AGENTSCOPE_CONFIRM_TIMEOUT_MINUTES:10}
    # SSE 连接超时（分钟），需大于「单回合最长耗时 + confirm-timeout-minutes」
    sse-timeout-minutes: ${AGENTSCOPE_SSE_TIMEOUT_MINUTES:60}
    # 单请求附件数量 / base64 总体积上限（防止超大附件直接打满堆）
    max-attachments: 20
    max-attachment-bytes: 33554432
    # 同时活跃 SSE 连接数上限：每条连接背后挂一个 Agent 回合，防止被反复调用打满线程池
    max-sse-connections: ${AGENTSCOPE_MAX_SSE_CONNECTIONS:64}
    # 循环护栏阈值（策略参数，原先硬编码在事件分发逻辑中）
    max-same-subagent-calls: 3
    max-consecutive-tool-failures: 2
    # Workspace Agent 缓存驱逐：每个 context 持有模型客户端/工具集/MCP 连接，需上限 + 空闲回收
    max-cached-workspaces: ${AGENTSCOPE_MAX_CACHED_WORKSPACES:32}
    workspace-idle-minutes: ${AGENTSCOPE_WORKSPACE_IDLE_MINUTES:120}
    shell-timeout-seconds: 300
    max-shell-output-bytes: 200000
  providers:
    deepseek:
      api-key:
      base-url:
      model-name:
    # 推理模型：支持 thinking（推理过程可视化），速度较慢
    deepseek-reasoner:
      api-key:
      base-url: https://api.deepseek.com/v1
      model-name: deepseek-reasoner
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url:
      model-name: ark-code-latest
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model-name: qwen-plus
    ollama:
      api-key: ollama
      base-url: http://localhost:11434/v1
      model-name: qwen2.5:7b
    moonshot:
      api-key: ${MOONSHOT_API_KEY:}
      base-url: https://api.moonshot.cn/v1
      model-name: moonshot-v1-8k
    zhipu:
      api-key: ${ZHIPU_API_KEY:}
      base-url: https://open.bigmodel.cn/api/paas/v4
      model-name: glm-4-flash

  # ============================
  # 按模型名的输出上限覆盖表（route / 网关型 provider 必需）
  # ----------------------------
  # 场景：一个 base-url + api-key 后面挂着 kimi、豆包、deepseek、glm 等多个模型，
  #       各家单次输出 token 上限差异极大：
  #         - 统一取大值 → 上限低的模型服务端直接 400（max_tokens 超限）
  #         - 统一取小值 → 大文件 write_file 的 arguments JSON 被截断 → 参数丢失
  # 匹配优先级：provider:model 精确 > model 精确 > 前缀通配（xxx*，最长优先）> providers.*.max-tokens > model.max-tokens
  # 说明：max-tokens-unsupported: true 表示该模型完全不接受 max_tokens 字段，届时不下发该参数。
  # ============================
  model-limits:
    # —— DeepSeek ——（deepseek-chat 8K；reasoner 含思维链，上限更高）
    deepseek-chat:
      max-tokens: 8192
    deepseek-reasoner:
      max-tokens: 32768
    deepseek-v3*:
      max-tokens: 8192
    # —— Kimi / Moonshot ——（8k 型号输出上限最小，必须单独压低）
    moonshot-v1-8k:
      max-tokens: 4096
    moonshot-v1-32k:
      max-tokens: 16384
    moonshot-v1-128k:
      max-tokens: 32768
    kimi-k2*:
      max-tokens: 32768
    kimi-*:
      max-tokens: 16384
    # —— 智谱 GLM ——（glm-4-flash 输出上限 4095，最容易被踩）
    glm-4-flash:
      max-tokens: 4095
    glm-4-plus:
      max-tokens: 8192
    glm-4.5*:
      max-tokens: 32768
    glm-*:
      max-tokens: 8192
    # —— 豆包 / 火山方舟 ——
    doubao-*:
      max-tokens: 16384
    ark-code-latest:
      max-tokens: 32768
    # —— 通义千问 ——
    qwen-plus:
      max-tokens: 16384
    qwen-max:
      max-tokens: 8192
    qwen*:
      max-tokens: 8192

# ============================
# 内置工具配置
# ----------------------------
# web_search 走 Google Custom Search（需自备凭据）：
#   1. 在 Google Cloud 控制台启用 "Custom Search API" 并创建 API Key
#   2. 在 https://programmablesearchengine.google.com/ 创建搜索引擎，取其「搜索引擎 ID」填入 cx
# 留空则回退环境变量 GOOGLE_API_KEY / GOOGLE_SEARCH_CX；两者都缺则 web_search 返回未配置提示。
# ============================
tools:
  web-search:
    api-key: ${GOOGLE_API_KEY:}
    cx: ${GOOGLE_SEARCH_CX:}

# ============================
# Workspace 安全配置
# ============================
ai:
  workspace:
    security:
      forbidden-paths:
        - .easyClaw
        - .git
        - .env
        - .idea
        - .vscode
        # AgentScope harness 运行时数据目录（<workspace>/<userId>/agents），AI 工具不可访问
        - default-user
        - agents
      max-file-size: 10485760

# ============================
# SQLite 系统元数据库（~/.easyClaw 目录，由启动类初始化）
# 所有 Workspace 共用；Workspace 自身的状态/对话数据存放在其指定目录的 .easyClaw/agent/ 下
# ============================

---
spring:
  config:
    activate:
      on-profile: dev-sqlite
  datasource:
    url: jdbc:sqlite:${user.home}/.easyClaw/ai-assistant.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: true


